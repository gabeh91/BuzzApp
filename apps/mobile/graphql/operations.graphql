query BuzzHome {
  interestsCollection(first: 50) {
    edges {
      node {
        id
        name
        slug
        category
      }
    }
  }
}

mutation ActivateInterest($interestId: UUID!) {
  activateInterest(interestId: $interestId)
}

query IncomingActivationPings {
  getIncomingActivationPings
}

query OutgoingActivationSummary {
  getOutgoingActivationSummary
}

query ChatSummaries {
  getChatSummaries
}

mutation RespondToActivationPing($pingId: UUID!, $response: String!) {
  respondToActivationPing(pingId: $pingId, response: $response)
}

mutation UpsertBuzzProfile(
  $userId: UUID!
  $displayName: String!
  $cityId: UUID!
  $quizAnswers: JSON!
  $quizTraits: JSON!
) {
  upsertBuzzProfile(
    userId: $userId
    displayName: $displayName
    cityId: $cityId
    quizAnswers: $quizAnswers
    quizTraits: $quizTraits
  )
}

query GroupMessages($groupId: UUID!) {
  groupMessagesCollection(
    first: 50
    filter: { activityGroupId: { eq: $groupId } }
    orderBy: [{ createdAt: AscNullsLast }]
  ) {
    edges {
      node {
        id
        activityGroupId
        senderId
        body
        messageType
        moderationStatus
        createdAt
        sender {
          id
          firstName
          displayName
          profilePhotoUrl
        }
      }
    }
  }
}

query ActivityGroupSummary($groupId: UUID!) {
  activityGroupsCollection(first: 1, filter: { id: { eq: $groupId } }) {
    edges {
      node {
        id
        title
        status
        city {
          id
          name
        }
        interest {
          id
          name
        }
        activityPlansCollection(
          first: 1
          orderBy: [{ createdAt: DescNullsLast }]
        ) {
          edges {
            node {
              id
              title
              description
              startsAt
              venueType
              publicLocationName
              capacityMin
              capacityMax
              safetyGuidance
            }
          }
        }
      }
    }
  }
}
