query BuzzHome {
  interestsCollection(first: 50) {
    edges {
      node {
        id
        name
        slug
        category
      }
    }
  }
}

mutation ActivateInterest($interestId: UUID!) {
  activateInterest(interestId: $interestId)
}

mutation UpsertBuzzProfile(
  $userId: UUID!
  $displayName: String!
  $cityId: UUID!
  $quizAnswers: JSON!
  $quizTraits: JSON!
) {
  upsertBuzzProfile(
    userId: $userId
    displayName: $displayName
    cityId: $cityId
    quizAnswers: $quizAnswers
    quizTraits: $quizTraits
  )
}

query GroupMessages($groupId: UUID!) {
  groupMessagesCollection(
    first: 50
    filter: { activityGroupId: { eq: $groupId } }
    orderBy: [{ createdAt: AscNullsLast }]
  ) {
    edges {
      node {
        id
        activityGroupId
        senderId
        body
        messageType
        moderationStatus
        createdAt
      }
    }
  }
}

mutation SendGroupMessage($activityGroupId: UUID!, $senderId: UUID!, $body: String!, $moderationStatus: String!) {
  insertIntoGroupMessagesCollection(
    objects: [
      {
        activityGroupId: $activityGroupId
        senderId: $senderId
        body: $body
        messageType: "text"
        moderationStatus: $moderationStatus
      }
    ]
  ) {
    records {
      id
      activityGroupId
      senderId
      body
      messageType
      moderationStatus
      createdAt
    }
  }
}
