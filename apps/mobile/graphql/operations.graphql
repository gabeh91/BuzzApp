query BuzzHome {
  interestsCollection(first: 50) {
    edges {
      node {
        id
        name
        slug
        category
      }
    }
  }
}

mutation ActivateInterest($interestId: UUID!) {
  activateInterest(interestId: $interestId)
}

mutation UpsertBuzzProfile(
  $userId: UUID!
  $displayName: String!
  $cityId: UUID!
  $quizAnswers: JSON!
  $quizTraits: JSON!
) {
  upsertBuzzProfile(
    userId: $userId
    displayName: $displayName
    cityId: $cityId
    quizAnswers: $quizAnswers
    quizTraits: $quizTraits
  )
}
