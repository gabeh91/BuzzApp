query AdminDashboard {
  interestsCollection(first: 50) {
    edges {
      node {
        id
        name
        slug
        category
      }
    }
  }
  businessesCollection(first: 10) {
    edges {
      node {
        id
        name
        description
      }
    }
  }
  eventsCollection(first: 10) {
    edges {
      node {
        id
        title
      }
    }
  }
  citySettingsCollection(first: 10) {
    edges {
      node {
        cityId
        matchingRadiusKm
        defaultGroupSizeMin
        defaultGroupSizeMax
        activationExpiryHours
        requiresInvite
        isWaitlistEnabled
      }
    }
  }
  reportsCollection(first: 10) {
    edges {
      node {
        id
        category
        status
        reason
        details
        source
        metadataJson
        activityGroupId
        targetUserId
        createdAt
      }
    }
  }
  activityGroupsCollection(first: 10) {
    edges {
      node {
        id
        title
        status
        createdAt
      }
    }
  }
  userReliabilityCollection(first: 10) {
    edges {
      node {
        userId
        attendedCount
        noShowCount
        cancelledLateCount
        feedbackCount
        reliabilityScore
        updatedAt
      }
    }
  }
  starterPlansCollection(first: 10) {
    edges {
      node {
        id
        title
        status
        minGroupSize
        maxGroupSize
        createdAt
      }
    }
  }
}
