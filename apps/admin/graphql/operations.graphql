query AdminDashboard {
  interestsCollection(first: 50) {
    edges {
      node {
        id
        name
        slug
        category
      }
    }
  }
  businessesCollection(first: 10) {
    edges {
      node {
        id
        name
        description
      }
    }
  }
  eventsCollection(first: 10) {
    edges {
      node {
        id
        title
      }
    }
  }
}
